<svg xmlns="http://www.w3.org/2000/svg" width="430" height="620" viewBox="0 0 430 620" role="img" aria-label="An iMessage conversation: the user asks to delete a reminder, Cortland asks for approval with a one-time code, the user replies yes, and the reminder is deleted.">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #d8d8dc; stroke-width: 1; }
    .bar { fill: #f6f6f6; }
    .name { font: 600 15px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .sub { font: 400 11px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #8a8a8e; }
    .me { fill: #007aff; }
    .them { fill: #e9e9eb; }
    .metxt { font: 400 14px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
    .themtxt { font: 400 14px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #111111; }
    .mono { font: 500 14px ui-monospace, "SF Mono", Menlo, monospace; }
    .tag { font: 400 10px -apple-system, "SF Pro Text", Arial, sans-serif; fill: #8a8a8e; }
  </style>

  <rect class="bg" x="0" y="0" width="430" height="620" rx="14"/>
  <rect class="frame" x="0.5" y="0.5" width="429" height="619" rx="14"/>

  <!-- header -->
  <rect class="bar" x="1" y="1" width="428" height="52" rx="14"/>
  <rect class="bar" x="1" y="38" width="428" height="15"/>
  <circle cx="30" cy="27" r="13" fill="#c9c9ce"/>
  <text class="name" x="52" y="24">Cortland</text>
  <text class="sub" x="52" y="39">local model · your Mac</text>
  <line x1="1" y1="53" x2="429" y2="53" stroke="#d8d8dc" stroke-width="1"/>

  <!-- 1. user asks -->
  <rect class="me" x="164" y="72" width="250" height="34" rx="17"/>
  <text class="metxt" x="180" y="94">Delete the call the vet reminder</text>

  <!-- 2. instant ack -->
  <rect class="them" x="16" y="118" width="196" height="34" rx="17"/>
  <text class="themtxt" x="32" y="140">Received — working on it…</text>

  <!-- 3. the approval request -->
  <rect class="them" x="16" y="164" width="368" height="128" rx="17"/>
  <text class="themtxt" x="32" y="188">Approval needed: reminder_delete</text>
  <text class="themtxt" x="32" y="210">Would permanently DELETE “call the vet”</text>
  <text class="themtxt" x="32" y="230">from the Home list, due Sunday at 2:00 PM.</text>
  <text class="themtxt" x="32" y="256">Reply <tspan class="mono">“yes a3f9c1”</tspan> to run it,</text>
  <text class="themtxt" x="32" y="276"><tspan class="mono">“no a3f9c1”</tspan> to refuse. No reply = refused.</text>

  <!-- 4. the human decides -->
  <rect class="me" x="288" y="304" width="126" height="34" rx="17"/>
  <text class="metxt mono" x="304" y="326">yes a3f9c1</text>

  <!-- 5. done, with specifics -->
  <rect class="them" x="16" y="350" width="330" height="56" rx="17"/>
  <text class="themtxt" x="32" y="374">Deleted “call the vet”, which was due</text>
  <text class="themtxt" x="32" y="394">Sunday at 2:00 PM.</text>

  <!-- annotation -->
  <line x1="16" y1="436" x2="414" y2="436" stroke="#e5e5ea" stroke-width="1"/>
  <text class="tag" x="16" y="458">The code is generated by the framework and never enters the model’s</text>
  <text class="tag" x="16" y="474">context — an injected model cannot forge your approval. Ignore the</text>
  <text class="tag" x="16" y="490">message and the action expires, refused. Every step is audited.</text>

  <text class="tag" x="16" y="524">Everything above ran on the user’s own Mac: a 4 GB local model,</text>
  <text class="tag" x="16" y="540">real Apple Reminders, no cloud service, no API key.</text>

  <!-- input bar -->
  <rect x="16" y="566" width="398" height="36" rx="18" fill="none" stroke="#d8d8dc"/>
  <text class="sub" x="34" y="589">iMessage</text>
  <circle cx="396" cy="584" r="13" fill="#007aff"/>
  <path d="M396 578 l0 12 M391 583 l5 -5 l5 5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
