<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Illustrated Osaurus walkthrough: open Management, Tools, Connections, add Cortland over loopback HTTP.">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #d8d8dc; stroke-width: 1; }
    .bar { fill: #f6f6f6; }
    .h { font: 600 15px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; fill: #111; }
    .s { font: 400 12px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; fill: #8a8a8e; }
    .p { font: 400 13px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; fill: #3a3a3c; }
    .n { font: 600 11px -apple-system, "SF Pro Text", Arial, sans-serif; fill: #fff; }
    .k { font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #111; }
    .sel { fill: #007aff; }
    .stroke { stroke: #d8d8dc; fill: #fff; }
    .pill { fill: #e9e9eb; }
  </style>
  <rect class="bg" width="720" height="420" rx="14"/>
  <rect class="frame" x="0.5" y="0.5" width="719" height="419" rx="14"/>

  <rect class="bar" x="1" y="1" width="718" height="48" rx="14"/>
  <rect class="bar" x="1" y="30" width="718" height="20"/>
  <text class="h" x="20" y="32">Osaurus ù Cortland as a remote MCP provider</text>

  <rect x="16" y="64" width="170" height="340" rx="10" class="stroke"/>
  <text class="s" x="28" y="88">Agents</text>
  <rect x="24" y="100" width="154" height="28" rx="6" class="sel"/>
  <text class="n" x="36" y="119">Tools</text>
  <text class="s" x="28" y="152">Providers</text>
  <text class="s" x="28" y="176">Models</text>
  <text class="s" x="28" y="200">Privacy</text>
  <rect class="pill" x="28" y="360" width="88" height="22" rx="11"/>
  <text class="s" x="40" y="375"> ù M</text>

  <rect x="200" y="64" width="500" height="340" rx="10" class="stroke"/>
  <text class="p" x="220" y="92">Osauruss Connections UI speaks HTTP MCP, not stdio.</text>
  <text class="p" x="220" y="114">So Cortland is reached through the loopback gateway.</text>

  <text class="p" x="220" y="150">1. Terminal: mint a token and serve</text>
  <text class="k" x="236" y="174">npx cortland-remote token mint --label osaurus</text>
  <text class="k" x="236" y="194">npx cortland-remote serve</text>

  <text class="p" x="220" y="230">2. In Osaurus: Tools ù Connections ù Add Provider</text>
  <text class="p" x="220" y="252">   Custom server, not the catalog.</text>

  <text class="p" x="220" y="288">3. URL and header</text>
  <text class="k" x="236" y="312">http://127.0.0.1:7811/mcp/mail</text>
  <text class="k" x="236" y="332">Authorization: Bearer &lt;shown-once token&gt;</text>

  <text class="s" x="220" y="368">Today the gateway mounts /mcp/mail and /mcp/context.</text>
  <text class="s" x="220" y="386">Reminders, notes, calendar: add those as stdio in Cursor / LM Studio.</text>
</svg>
