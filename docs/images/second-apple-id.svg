<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Illustrated Messages settings: sign a second Apple ID into iMessage on the Mac only. System iCloud stays yours.">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #d8d8dc; stroke-width: 1; }
    .bar { fill: #f6f6f6; }
    .h { font: 600 15px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; fill: #111; }
    .s { font: 400 12px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; fill: #8a8a8e; }
    .p { font: 400 13px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; fill: #3a3a3c; }
    .k { font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #111; }
    .ok { fill: #34c759; }
    .stroke { stroke: #d8d8dc; fill: #fff; }
    .warn { fill: #fff4e5; stroke: #f5c518; }
  </style>
  <rect class="bg" width="720" height="400" rx="14"/>
  <rect class="frame" x="0.5" y="0.5" width="719" height="399" rx="14"/>

  <rect class="bar" x="1" y="1" width="718" height="48" rx="14"/>
  <rect class="bar" x="1" y="30" width="718" height="20"/>
  <text class="h" x="20" y="32">Messages · second Apple ID (iMessage bridge only)</text>

  <rect x="16" y="64" width="330" height="320" rx="10" class="stroke"/>
  <text class="h" x="32" y="92">Your Mac stays you</text>
  <text class="p" x="32" y="118">System Settings ’ Apple ID</text>
  <text class="k" x="32" y="140">you@example.com</text>
  <circle class="ok" cx="40" cy="168" r="5"/>
  <text class="p" x="54" y="173">iCloud Drive, Mail, Photos  untouched</text>
  <circle class="ok" cx="40" cy="196" r="5"/>
  <text class="p" x="54" y="201">Reminders, Notes, Calendar  yours</text>
  <text class="s" x="32" y="236">Cortlands tools run as this account.</text>
  <text class="s" x="32" y="254">The second ID never sees this data.</text>

  <rect x="362" y="64" width="342" height="320" rx="10" class="stroke"/>
  <text class="h" x="378" y="92">Messages.app only</text>
  <text class="p" x="378" y="118">Messages ’ Settings ’ iMessage</text>
  <text class="k" x="378" y="140">assistant@example.com</text>
  <text class="p" x="378" y="168">Sign in with a new Apple ID you created</text>
  <text class="p" x="378" y="186">for this. Strong password + 2FA.</text>
  <text class="s" x="378" y="220">Mouthpiece, not a worker. It exists so</text>
  <text class="s" x="378" y="238">your phone has a contact named Cortland.</text>

  <rect x="378" y="262" width="310" height="100" rx="8" class="warn"/>
  <text class="p" x="394" y="288">Do not sign this ID into iCloud on the Mac.</text>
  <text class="s" x="394" y="310">If someone steals it they can read the thread</text>
  <text class="s" x="394" y="328">and impersonate the assistant  they cannot</text>
  <text class="s" x="394" y="346">command or approve. Thats pinned to you.</text>
</svg>
